<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Koveer9 — Asset Controller</title>
<style>
  :root {
    --bg: #0b1020; --panel: #131a2e; --panel-2: #1a2338;
    --accent: #4ea1ff; --green: #22c55e; --red: #ef4444;
    --text: #e6ebf5; --muted: #8a94ab; --border: #243049;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header.brand {
    padding: 18px 24px; background: linear-gradient(90deg, #0f1830 0%, #182345 55%, #0f1830 100%);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;
  }
  header.brand h1 { margin: 0; font-size: 22px; letter-spacing: 1px; font-weight: 700; }
  header.brand h1 .amp { color: var(--accent); margin: 0 6px; }
  header.brand .sub { color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  header.brand button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  header.brand button:hover { border-color: var(--accent); }
  
  main.grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 18px; min-height: 0; }
  @media (max-width: 900px) { main.grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel header h2 { margin: 0; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .panel header input.search { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; outline: none; }
  
  .scroll { overflow-y: auto; padding: 8px; flex: 1; min-height: 0; }
  .cat { color: var(--muted); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; padding: 10px 10px 6px; }
  
  .item { padding: 9px 12px; margin: 2px 4px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border: 1px solid transparent; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: rgba(34,197,94,0.12); border-color: var(--green); }
  
  .btn-add, .btn-remove { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .btn-add:hover { border-color: var(--green); color: var(--green); }
  .btn-remove:hover { border-color: var(--red); color: var(--red); }

  .toast { position: fixed; bottom: 70px; right: 20px; background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--red); }
</style>
</head>
<body>
<header class="brand">
  <div>
    <h1>Koveer9 <span class="amp">&amp;</span> Dola</h1>
    <div class="sub">Asset Controller</div>
  </div>
  <div><button id="btnClear">✕ Stop All Assets</button></div>
</header>

<main class="grid">
  <section class="panel">
    <header>
      <h2>Available Assets</h2>
      <input type="text" class="search" id="assetSearch" placeholder="Search…" />
    </header>
    <div class="scroll" id="assetsList"></div>
  </section>

  <section class="panel">
    <header><h2>Running Assets</h2></header>
    <div class="scroll" id="activeList"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let assets = {};
let active_assets = [];
let currentFilter = "";

function toast(msg, err = false) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove("show"), 2200);
}

async function jget(url) { const r = await fetch(url); return r.json(); }
async function jpost(url, body) { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); return r.json(); }

async function loadState() {
  try {
    const res = await jget("/api/state");
    active_assets = res.active_assets || [];
  } catch (e) {}
}

async function loadAssets() {
  try {
    assets = await jget("/api/assets");
    renderAssets();
  } catch (e) {}
}

function renderAssets() {
  const list = $("assetsList"); list.innerHTML = "";
  const activeList = $("activeList"); activeList.innerHTML = "";
  const filter = currentFilter.toLowerCase();
  const activeSet = new Set(active_assets);

  const cats = [["otc_forex", "OTC Forex"], ["otc_commodities", "OTC Commodities"], ["otc_crypto", "OTC Crypto"], ["otc_stocks", "OTC Stocks"], ["otc_indices", "OTC Indices"], ["regular", "Regular"]];
  let shown = 0;
  for (const [key, label] of cats) {
    const items = (assets[key] || []).filter(s => !filter || s.toLowerCase().includes(filter));
    if (items.length === 0) continue;
    const h = document.createElement("div"); h.className = "cat"; h.textContent = label; list.appendChild(h);
    for (const sym of items) {
      if (activeSet.has(sym)) continue;
      const div = document.createElement("div"); div.className = "item";
      div.innerHTML = `<span>${sym}</span><button class="btn-add" data-sym="${sym}">+ Add</button>`;
      list.appendChild(div); shown++;
    }
  }
  if (shown === 0 && filter === "") {
    const d = document.createElement("div"); d.className = "cat"; d.textContent = "No available assets"; list.appendChild(d);
  }

  if (active_assets.length === 0) {
    const d = document.createElement("div"); d.className = "cat"; d.textContent = "No running assets"; activeList.appendChild(d);
  } else {
    for (const sym of active_assets) {
      const div = document.createElement("div"); div.className = "item active";
      div.innerHTML = `<span>${sym}</span><button class="btn-remove" data-sym="${sym}">− Stop</button>`;
      activeList.appendChild(div);
    }
  }

  document.querySelectorAll(".btn-add").forEach(b => b.addEventListener("click", () => addAsset(b.dataset.sym)));
  document.querySelectorAll(".btn-remove").forEach(b => b.addEventListener("click", () => removeAsset(b.dataset.sym)));
}

async function addAsset(name) {
  await jpost("/api/active/add", { name });
  await loadState(); renderAssets(); toast("Added: " + name);
}

async function removeAsset(name) {
  await jpost("/api/active/remove", { name });
  await loadState(); renderAssets(); toast("Stopped: " + name);
}

$("btnClear").addEventListener("click", async () => {
  if (!confirm("Stop all running assets?")) return;
  await jpost("/api/active/clear", {});
  await loadState(); renderAssets(); toast("All cleared");
});

$("assetSearch").addEventListener("input", (e) => { currentFilter = e.target.value.trim(); renderAssets(); });

async function init() {
  await loadState(); await loadAssets();
  setInterval(async () => { await loadState(); renderAssets(); }, 3000);
}
init();
</script>
</body>
</html>
