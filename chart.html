<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KoveerBridge — Pro Live Chart</title>
<link rel="preload" as="image" href="/static/images/koveer-background.jpg">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg: #0b1020; --panel: #131a2e; --text: #e6ebf5; --muted: #8a94ab; --border: #243049; --green: #22c55e; --red: #ef4444; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { padding: 15px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  header > div { display: flex; align-items: center; gap: 15px; min-width: 0; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; color: #fff; overflow-wrap: anywhere; }
  header select { max-width: 55vw; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-size: 15px; outline: none; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
  #chart-container { flex: 1; width: 100%; min-height: 0; position: relative; }
  #status { position: absolute; top: 15px; left: 15px; background: rgba(19,26,46,0.92); padding: 8px 14px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); z-index: 10; font-weight: 500; pointer-events: none; }
  @media (max-width: 560px) { header { padding: 10px; } header h1 { font-size: 17px; } header > div { gap: 8px; width: 100%; } header select { flex: 1; max-width: none; min-width: 0; } header a { font-size: 12px; } }

/* ============================================================
   KOVEER BRIDGE CHART — FULLSCREEN FIXED BACKGROUND (ALWAYS COVER)
   ============================================================ */
html {
  background-color: #050914;
  min-height: 100%;
}

body {
  background: none !important;
  background-color: transparent !important;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image: url("/static/images/koveer-background.jpg");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #050914;
  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    rgba(3, 8, 18, 0.50),
    rgba(3, 8, 18, 0.68)
  );
  pointer-events: none;
}

header {
  background: rgba(3, 9, 20, 0.84) !important;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(37, 186, 255, 0.30);
}

#chart-container {
  background: transparent !important;
}

#status {
  background: rgba(5, 17, 32, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(37, 186, 255, 0.35);
}
</style>
</head>
<body>
  <header>
    <div>
      <h1 id="assetName">Loading...</h1>
      <select id="assetSelect" aria-label="Select asset" onchange="changeAsset()"><option>Loading...</option></select>
    </div>
    <a href="http://127.0.0.1:8080">← Dashboard</a>
  </header>
  <div id="chart-container"><div id="status">⏳ Initializing...</div></div>

  <script>
    let chart, candleSeries;
    let ema50Series, ema200Series, bbUpperSeries, bbLowerSeries;
    let currentAsset = '';
    let lastCandleTime = 0;
    let isFetching = false;
    let historicalData = [];
    const MAX_DISPLAY_CANDLES = 1200;

    function initChart() {
      const container = document.getElementById('chart-container');
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: { background: {
        type: 'solid',
        color: 'rgba(5, 9, 20, 0)'
      },
    textColor: '#e6ebf5'},
        grid: { vertLines: { color: '#243049' }, horzLines: { color: '#243049' } },
        timeScale: {
          timeVisible: true,
          secondsVisible: false,
          shiftVisibleRangeOnNewBar: false,
          rightOffset: 10,
          uniformDistribution: true,
          borderColor: '#243049'
        },
        rightPriceScale: {
          borderColor: '#243049',
          autoScale: true,
          scaleMargins: { top: 0.1, bottom: 0.1 }
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
      });

      candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#22c55e', downColor: '#ef4444', borderVisible: false,
        wickUpColor: '#22c55e', wickDownColor: '#ef4444',
        lastValueVisible: false, priceLineVisible: false
      });
      ema50Series = chart.addSeries(LightweightCharts.LineSeries, { color: '#f59e0b', lineWidth: 2, title: 'EMA 50' });
      ema200Series = chart.addSeries(LightweightCharts.LineSeries, { color: '#8a94ab', lineWidth: 2, title: 'EMA 200' });
      bbUpperSeries = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(78, 161, 255, 0.5)', lineWidth: 1, title: 'BB Upper' });
      bbLowerSeries = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(78, 161, 255, 0.5)', lineWidth: 1, title: 'BB Lower' });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    function calculateEMA(data, period) {
      if (!Array.isArray(data) || data.length === 0) return [];
      const k = 2 / (period + 1);
      const result = [];
      let ema = Number(data[0].close);
      data.forEach((c) => {
        ema = (Number(c.close) - ema) * k + ema;
        result.push({ time: c.time, value: ema });
      });
      return result;
    }

    function calculateBB(data, period = 20, multiplier = 2) {
      const upper = [], lower = [];
      for (let i = 0; i < data.length; i++) {
        if (i < period - 1) continue;
        const slice = data.slice(i - period + 1, i + 1);
        const closes = slice.map(c => Number(c.close));
        const sma = closes.reduce((a, b) => a + b, 0) / period;
        const variance = closes.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        const stdDev = Math.sqrt(variance);
        upper.push({ time: data[i].time, value: sma + multiplier * stdDev });
        lower.push({ time: data[i].time, value: sma - multiplier * stdDev });
      }
      return { upper, lower };
    }

    function setStatus(msg, color = '#22c55e') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = color;
    }

    function renderIndicators() {
      ema50Series.setData(calculateEMA(historicalData, 50));
      ema200Series.setData(calculateEMA(historicalData, 200));
      const bands = calculateBB(historicalData, 20, 2);
      bbUpperSeries.setData(bands.upper);
      bbLowerSeries.setData(bands.lower);
    }

    function normalizeCandles(candles) {
      const byTime = new Map();
      (candles || []).forEach((c) => {
        const time = Number(c.time);
        const open = Number(c.open), high = Number(c.high);
        const low = Number(c.low), close = Number(c.close);
        if (!Number.isFinite(time) || ![open, high, low, close].every(Number.isFinite)) return;
        byTime.set(time, { time, open, high, low, close });
      });
      return Array.from(byTime.values()).sort((a, b) => a.time - b.time);
    }

    function changeAsset() {
      const select = document.getElementById('assetSelect');
      currentAsset = select.value;
      document.getElementById('assetName').textContent = currentAsset || 'No asset';
      historicalData = [];
      lastCandleTime = 0;
      candleSeries.setData([]);
      ema50Series.setData([]);
      ema200Series.setData([]);
      bbUpperSeries.setData([]);
      bbLowerSeries.setData([]);
      fetchCandles(true);
    }

    async function fetchAssets() {
      try {
        const res = await fetch('http://127.0.0.1:8081/api/chart_assets', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data.assets) && data.assets.length) {
          const select = document.getElementById('assetSelect');
          const previous = currentAsset;
          select.replaceChildren();
          data.assets.forEach((asset) => select.add(new Option(asset, asset)));
          currentAsset = data.assets.includes(previous) ? previous : data.assets[0];
          select.value = currentAsset;
          document.getElementById('assetName').textContent = currentAsset;
          await fetchCandles(true);
        } else {
          setStatus('⚠️ No active assets', '#f59e0b');
        }
      } catch (e) {
        setStatus('❌ Chart API unavailable. Retrying...', '#ef4444');
        setTimeout(fetchAssets, 3000);
      }
    }

    async function fetchCandles(fullLoad = false) {
      if (!currentAsset || isFetching) return;
      isFetching = true;
      const url = `http://127.0.0.1:8081/api/chart_data?asset=${encodeURIComponent(currentAsset)}${fullLoad ? '' : '&last=1'}`;
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.error && (!data.candles || !data.candles.length)) throw new Error(data.error);
        const incoming = normalizeCandles(data.candles);
        if (!incoming.length) {
          setStatus(`⏳ Waiting for ${currentAsset} candles...`, '#f59e0b');
          return;
        }

        if (data.digits !== undefined && Number.isInteger(Number(data.digits))) {
          const digits = Math.max(0, Math.min(10, Number(data.digits)));
          candleSeries.applyOptions({ priceFormat: { type: 'price', precision: digits, minMove: Math.pow(10, -digits) } });
        }

        if (fullLoad) {
          historicalData = incoming.slice(-MAX_DISPLAY_CANDLES);
          candleSeries.setData(historicalData);
          lastCandleTime = historicalData[historicalData.length - 1].time;
          renderIndicators();
          chart.timeScale().fitContent();
        } else {
          const candle = incoming[incoming.length - 1];
          if (candle.time > lastCandleTime) {
            historicalData.push(candle);
            if (historicalData.length > MAX_DISPLAY_CANDLES) historicalData.shift();
            lastCandleTime = candle.time;
          } else if (candle.time === lastCandleTime) {
            historicalData[historicalData.length - 1] = candle;
          } else {
            return;
          }
          candleSeries.update(candle);
          renderIndicators();
        }

        const last = historicalData[historicalData.length - 1];
        const timeStr = new Date(last.time * 1000).toLocaleTimeString('en-GB', { hour12: false });
        const recovered = Number(data.recovered_candles || 0);
        setStatus(`🟢 ${currentAsset} | ${historicalData.length} candles | Last: ${last.close} | ${timeStr}${recovered ? ` | recovered ${recovered}` : ''}`, '#22c55e');
      } catch (e) {
        setStatus(`⚠️ ${e.message || 'Connection lost. Retrying...'}`, '#ef4444');
      } finally {
        isFetching = false;
      }
    }

    initChart();
    fetchAssets();
    setInterval(() => fetchCandles(false), 2000);
  </script>
</body>
</html>
